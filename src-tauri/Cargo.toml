[package]
name = "tinydiff"
version = "0.1.0"
description = "TinyDiff - High performance folder & file diff tool"
authors = ["you"]
edition = "2021"

[lib]
name = "tinydiff_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "2"
filetime = "0.2"
walkdir = "2"
rayon = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
